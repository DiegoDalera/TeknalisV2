<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1536" height="1024" fill="#0F172A"/>

  <g transform="translate(568,90)">
    <rect width="400" height="844" rx="28" fill="#141d38" stroke="#2a3655" stroke-width="1.5"/>

    <rect x="0" y="0" width="400" height="90" rx="28" fill="#075E54"/>
    <rect x="0" y="62" width="400" height="28" fill="#075E54"/>
    <circle cx="56" cy="53" r="22" fill="rgba(255,255,255,0.18)"/>
