    <text x="90" y="48" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Veterinaria San Roque</text>
    <text x="90" y="70" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">Asistente virtual</text>

