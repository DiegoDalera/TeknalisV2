    <rect x="24" y="120" width="240" height="58" rx="10" fill="#ffffff"/>
    <text x="40" y="144" font-family="Arial, sans-serif" font-size="13" fill="#111">¡Hola! ¿En qué te puedo</text>
    <text x="40" y="162" font-family="Arial, sans-serif" font-size="13" fill="#111">ayudar? 🐾</text>

    <rect x="176" y="196" width="200" height="42" rx="10" fill="#DCF8C6"/>
    <text x="192" y="222" font-family="Arial, sans-serif" font-size="13" fill="#111">¿qué horarios tienen?</text>

    <rect x="24" y="256" width="280" height="86" rx="10" fill="#ffffff"/>
    <text x="40" y="280" font-family="Arial, sans-serif" font-size="13" fill="#111">Lunes a viernes 9 a 19hs</text>
    <text x="40" y="298" font-family="Arial, sans-serif" font-size="13" fill="#111">Sábados 9 a 13hs</text>
    <text x="40" y="316" font-family="Arial, sans-serif" font-size="13" fill="#111">Domingos cerrado 🗓️</text>

    <rect x="120" y="360" width="256" height="42" rx="10" fill="#DCF8C6"/>
    <text x="136" y="386" font-family="Arial, sans-serif" font-size="13" fill="#111">necesito vacunar a mi perro</text>

    <rect x="24" y="420" width="300" height="86" rx="10" fill="#ffffff"/>
    <text x="40" y="444" font-family="Arial, sans-serif" font-size="13" fill="#111">Dale! Traé la libreta sanitaria</text>
    <text x="40" y="462" font-family="Arial, sans-serif" font-size="13" fill="#111">si la tenés. ¿Querés que te</text>
    <text x="40" y="480" font-family="Arial, sans-serif" font-size="13" fill="#111">ayude a reservar un turno?</text>

    <rect x="24" y="524" width="220" height="24" rx="12" fill="#ffffff"/>
    <text x="40" y="540" font-family="Arial, sans-serif" font-size="11" fill="#888">↳ deriva a un humano si hace falta</text>

    <rect x="0" y="744" width="400" height="100" fill="#141d38"/>
    <rect x="20" y="770" width="300" height="44" rx="22" fill="#ffffff"/>
    <text x="40" y="798" font-family="Arial, sans-serif" font-size="13" fill="#999">Escribí un mensaje</text>
    <circle cx="356" cy="792" r="22" fill="#075E54"/>
    <path d="M347 792 L365 792 M358 783 L367 792 L358 801" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
