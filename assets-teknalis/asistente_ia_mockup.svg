    <text x="0" y="80" font-size="32" font-weight="800" fill="#e7ecf5">Asistente con IA</text>
    <text x="0" y="114" font-size="16" fill="#8b95ad">Responde FAQs las 24hs</text>
    <text x="0" y="138" font-size="16" fill="#8b95ad">y deriva a un humano</text>
